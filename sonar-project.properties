sonar.projectKey=firebase-saas-auth
sonar.projectName=firebase-saas-auth (Broadcast)
sonar.sourceEncoding=UTF-8

sonar.sources=functions/src,web/src,scripts
sonar.tests=functions/test,web/src,tests
sonar.exclusions=**/*.test.ts,**/*.test.tsx,web/src/test/**,**/node_modules/**,**/dist/**,**/lib/**,**/coverage*/**
