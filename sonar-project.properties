sonar.coverage.exclusions=web/src/main.tsx,web/src/vite-env.d.ts,functions/src/index.ts,scripts/**

sonar.javascript.lcov.reportPaths=web/coverage/lcov.info,web/coverage-integration/lcov.info,functions/coverage/lcov.info
