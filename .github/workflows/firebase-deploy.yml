name: Firebase CI/CD

on:
  push:
    branches: ["main"]
    paths-ignore: ["gitpagedocs/**", "**/*.md"]
  pull_request:
    branches: ["main"]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: firebase-${{ github.ref }}
  cancel-in-progress: true

env:
  NODE_VERSION: "22"
  VITE_FIREBASE_API_KEY: ${{ vars.VITE_FIREBASE_API_KEY }}
  VITE_FIREBASE_AUTH_DOMAIN: ${{ vars.VITE_FIREBASE_AUTH_DOMAIN }}
  VITE_FIREBASE_PROJECT_ID: ${{ vars.VITE_FIREBASE_PROJECT_ID }}
  VITE_FIREBASE_STORAGE_BUCKET: ${{ vars.VITE_FIREBASE_STORAGE_BUCKET }}
  VITE_FIREBASE_MESSAGING_SENDER_ID: ${{ vars.VITE_FIREBASE_MESSAGING_SENDER_ID }}
  VITE_FIREBASE_APP_ID: ${{ vars.VITE_FIREBASE_APP_ID }}

jobs:
  quality:
    name: Lint, typecheck, test and build
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
          cache-dependency-path: |
            package-lock.json
            functions/package-lock.json
            web/package-lock.json

      - name: Setup Java (Firestore emulator)
        uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: "21"

      - name: Install dependencies
        run: |
          npm ci
          npm ci --prefix functions
          npm ci --prefix web

      - name: Lint
        run: npm run lint

      - name: Typecheck
        run: npm run typecheck

      - name: Test (rules, functions and web)
        run: |
          npm run test:rules
          npm --prefix functions run test:coverage
          npm --prefix web run test:coverage
          npm --prefix web run test:integration:coverage

      - name: Build
        run: npm run build

  # Deploy is opt-in: without the service account secret the deploy job does not run
  # (no failed run, no empty production deployment); adding the secret enables it.
  deploy-credentials:
    name: Check deploy credentials
    if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-24.04
    outputs:
      configured: ${{ steps.check.outputs.configured }}
    steps:
      - id: check
        env:
          SERVICE_ACCOUNT: ${{ secrets.FIREBASE_SERVICE_ACCOUNT }}
        run: |
          if [ -n "$SERVICE_ACCOUNT" ]; then
            echo "configured=true" >> "$GITHUB_OUTPUT"
          else
            echo "configured=false" >> "$GITHUB_OUTPUT"
            echo "::notice::Deploy disabled: add the FIREBASE_SERVICE_ACCOUNT secret (Settings > Secrets and variables > Actions) to enable it. See README, Deploy automático."
          fi

  deploy:
    name: Deploy to Firebase
    needs: [quality, deploy-credentials]
    if: needs.deploy-credentials.outputs.configured == 'true'
    runs-on: ubuntu-24.04
    environment: production
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
          cache-dependency-path: |
            package-lock.json
            functions/package-lock.json
            web/package-lock.json

      - name: Install dependencies
        run: |
          npm ci
          npm ci --prefix functions
          npm ci --prefix web

      - name: Authenticate to Google Cloud
        uses: google-github-actions/auth@v3
        with:
          credentials_json: ${{ secrets.FIREBASE_SERVICE_ACCOUNT }}

      - name: Deploy Firestore rules and indexes, Cloud Functions and Hosting
        run: >
          npx firebase deploy
          --only firestore,functions,hosting
          --project "${{ vars.VITE_FIREBASE_PROJECT_ID }}"
          --non-interactive
          --force
